id: DES-0057
title: The web UI adds four document operations to the registry, one static-file peer system, and a TypeScript workspace in src/web with two hosts and an agent interface
status: accepted
priority: p2
date: 2026-10-17
refines: [REQ-0080, DEC-0011, DEC-0012]
affects: [dispatch-request, loopback-host-p, resolve-caller-grants,
          docstore-read, docstore-write, check-document-references]
tags: [web, ui, react, tailwind, agents, adapter, rest, mobile,
       req-0080, dec-0011, dec-0008, des-0006, des-0051, dec-0001]
summary: |
  The service already answers most of what the UI asks. `find`, `describe`,
  `impact` and `check_document` are REST routes now, and `set-status` and
  `complete` are the transitions. Four things are missing: a list of
  documents with their status, the text of one document with its version, a
  write of that text, and the creation of a requirement or a bug. They are four
  registry operations, so REST and MCP get
  them together (DES-0006 R5).

  The UI is a TypeScript workspace in `src/web/`. A Node server in it proxies
  the browser's calls to the Synoptik REST API as the standalone UI's own
  listener. The CloudCLI plugin, which runs the same server code as a
  subprocess, moved to DES-0058 on 2026-10-18. Agent control is a TypeScript interface whose adapters run in that
  server, so their credentials stay out of the browser.

  The Node server is also the answer to phone access. The Synoptik listener
  refuses any non-loopback Host (DEC-0008) and has no credential, so a phone
  cannot reach it. The Node server can listen on the network, authenticate the
  caller, and forward to Synoptik on loopback. It becomes the authentication
  boundary the service lacks, so it must hold that boundary (D6).
body: |
  PRIORITY: P2, 2026-10-17

  WHAT THE SERVICE LACKS

  D1  Four operations. Each is a `define-operation` in
      `src/serve/operations.lisp`, which gives REST a route (DES-0006 R5). MCP
      lists its tools by hand in `src/mcp/tools.lisp`, and these four are not
      added: an agent edits the file in its worktree, and MCP's tool set stays
      as DES-0006 fixed it.

      `documents` (:read) takes an optional `repository` (all watched ones when
      absent) and answers one row per document: id, title, type, category,
      status, priority, severity, date, tags, path, and the ids it refines and
      affects. It takes no filter, for the reason D1b gives. `find` cannot do
      this: it takes a required `term` and its rows carry no status. The index
      held neither `tags` nor `date` for a workflow document, and the explorer
      filters on tags, so the `:document` entity declares both and the analyzer
      reads them.

      `read-document` (:read) takes `repository` and `document` and answers the
      text and a version token.

      `write-document` (:write) takes `repository`, `document`, `text` and
      `version`. The version token is the length of the text and a hash of it,
      because a store's own version is not a value that crosses a process
      boundary (DES-0051 N2). Under the repository lock the write compares the
      token with the text now stored, and passes the store the version it just
      read as `:expected-version`, so a file changed between the two is still
      refused. A text that is no longer the one read signals `version-conflict`,
      which REST answers 409 with `current` holding the stored text and
      version, and nothing is written. A save of the text already stored
      answers `changed: false` and touches no file. A write that succeeds
      answers the new version and the `check-document` result for the text just
      written, so the editor shows what the save resolves to without a second
      call. The write does not refuse a document for having an unresolved
      reference; `check` reports those and a draft may name a document not yet
      written.

      The operations do not call the document store themselves. Only
      synoptik-workspace may (RULE-0011, RULE-0012), so `read-document-text`,
      `write-document-text` and `create-document` are in
      `src/workspace/document-edit.lisp`, and the operations call those.

      DEC-0001 holds. The write goes to the file through the document store,
      and the index is brought up to date by one `poll-documents` after it, the
      call the file monitor makes. It writes nothing to the graph directly.

  D1a `create-document` (:write) takes `repository`, `category` and `title`, and
      optionally `refines`. It accepts the categories `req` and `bug` and
      refuses every other with a message naming the two that are allowed, so
      the rule is held once, in the service, and an agent using this route is
      held to it as the UI is. It takes the id from `docstore-allocate-id`,
      builds the text from a template, and writes it with `docstore-create`. It
      answers the new record. Agents still write other documents as files, as
      they do now.

  D1b The explorer filters in the browser. A repository's documents number in
      the hundreds (338 in this tree), and the `documents` rows carry every
      field a filter or an edge needs, so one call per repository feeds the
      list and the map. Widening a filter by N links walks `refines` and
      `affects` in both directions over those rows. If a tree grows past what a
      browser filters comfortably, the filter moves into `documents`' arguments,
      which already include `type`, `status` and `query`.

  D2  The relationship view composes existing answers. A document's links come
      from `describe`, and which of its declared references fail to resolve
      comes from `check-document` with a path and no contents. A third
      operation for a neighbourhood is added only if the composed view is
      measured to need more round trips than a person waits for, and the
      measurement is recorded where the operation is.

  D3  Transitions use `set-status` and `complete` unchanged. The UI shows
      `complete`'s dry run as text and sends the same verdicts string the
      console takes. It computes nothing about what a transition needs.

  WHERE THE FILES LIVE

  D4  `src/web/` is an npm workspace. It holds no Lisp.

      packages/client   the Client type, a fetch-based client, the response
                        types, and the conflict error.
      packages/ui       React components styled with Tailwind (DEC-0011), and
                        and `mountInShadowRoot(container, client, options)`,
                        which belongs to DES-0058.
      packages/agents   the AgentController interface, the status type, the
                        native adapter and the host adapter. The CloudCLI
                        adapter is there too and belongs to DES-0058.
      packages/server   the proxy: `createHandler(config)`, a function from a
                        request to a response, with no listener of its own.
      apps/standalone   the Vite shell and a listener that serves its build and
                        calls `createHandler`. `npm run build` writes `dist/`.

      The CloudCLI plugin is not in this tree. It is DES-0058 D1.

  D5  The Client type is `(method, path, body?) => Promise<Json>`. Components
      receive one and never build a URL. In the standalone shell it calls the
      Node server on the page's own origin under `/api/`. A second host that
      reaches the same `createHandler` another way is DES-0058 D2, so there is
      still one proxy to test and one to audit.

  D6  The proxy. `createHandler({serviceUrl, token, allow, adapters})` answers
      three families of request.

      `/api/v1/<operation>` is forwarded to `<serviceUrl>/v1/<operation>` and
      only when the operation is on the allow list. The list holds the read
      operations, `documents`, `read-document`, `write-document`,
      `create-document`, `set-status`, `complete`, and the four that change the
      workspace: `watch`, `pause`, `unwatch` and `reindex` (D16). All but the
      reads are :write operations and need the same token. It excludes the repl
      tier and the operations a person at a terminal runs and an interface has
      no use for: `init`, `embed`, `architecture` and `remove`. The proxy sets
      Host to the service's
      own loopback name, so DEC-0008's check passes on the Lisp side.

      `/api/agents/...` calls the configured AgentController adapters, which run
      here. A credential an adapter needs is read from the server's configuration
      and is never sent to the browser.

      `/api/events` is a server-sent event stream of status changes, built from
      the adapters' `subscribe`.

      Because the proxy forwards with a loopback Host, it is the authentication
      boundary DEC-0008 says the service lacks. The standalone listener binds
      127.0.0.1 by default. It binds any other address only when a token is
      configured, compares each request's bearer token in constant time, and
      refuses to start without one. The standalone listener over plain HTTP sends the token in the
      clear, so reaching it beyond the local network needs TLS or a tunnel
      the user provides.

      No Lisp system is added. The static files are served by Node, so the path
      traversal check is one the Node server owns and the Lisp `register-handler`
      prefix list is unchanged.

  THE WORKSPACE

  D16 The workspace is the service's set of watched repositories. The UI reads it
      from `status`, which lists every repository with its state, commit and
      document count, and changes it with `watch`, `pause`, `unwatch` and
      `reindex`. Nothing about the set is stored by the UI.

      A document is keyed by repository and id in every component, and the
      explorer's filter and its widening walk keys, because `REQ-0034` names a
      different document in each repository. A reference is a bare id, resolved
      in the document's own repository, or `@repo/ID`, which crosses. Crossing
      resolves only once REQ-0073 lands; before that the UI draws what resolves
      and marks the rest.

      `/api/folders` is answered by the Node server and not forwarded. It lists
      directories one level under each root in the server's configuration, and
      marks each as a git repository or not by checking for `.git`. `watch` is
      called only with a path from that list, and the server refuses any other,
      so the browser cannot ask the service to read an arbitrary path. The roots
      default to none, and an operator sets them. Removing a folder calls
      `unwatch`, which drops the index and leaves the files. A folder that is
      gone from disk is unknown to the service, so `POST /api/workspace/forget`
      removes it from the workspace file alone, and refuses a path the file does
      not list.

      The workspace is stored by the Node server in `~/.synoptik/web.json`
      (directory mode 0700, file mode 0600), or under `$SYNOPTIK_WEB_HOME` when
      that is set, which the tests use. The file is JSON with `version`, `roots`
      (the directories `/api/folders` lists under) and `repositories`, a list of
      `{path, paused}`. A change calls the service first and writes the file
      only when the service accepted it, so the file never lists a folder the
      service refused. A write goes to a temporary file in the same directory
      and is renamed over the original, so a crash leaves the old file or the
      new one. At startup the server calls `watch` for each path and `pause` for
      each paused one, and reports a path that is missing or not a git
      repository as `missing` in the list without removing it. A missing file is
      an empty workspace. A file that does not parse is reported in `/api/folders`
      and left as it is, and the server runs with an empty workspace and writes
      nothing until the file is fixed or deleted. The file holds no token: the
      bearer token comes from the environment (D6). A second host that reads the
      same file (DES-0058) would see a folder added in either after the next
      load.

  D17 Interface state is a second file, `~/.synoptik/ui-state.json`, beside the
      workspace file and under the same directory rules, because it changes on
      every click and the workspace changes rarely, and one write must not
      carry the other. It holds `version`, `filters`, `view`, `theme`, `open`
      (a repository and id) and `recent` (at most eight, newest first). The
      server answers `GET` and `PUT /api/ui-state`. The UI saves after a change
      settles for 500 ms and on the page being hidden, and reads once at load.
      The last write wins when two devices write. Stored keys are checked
      against the loaded workspace and an unknown one is dropped, so a removed
      folder cannot leave a dead entry. An unparsable file is handled as in D16.
      The prototype keeps both files in browser storage.

  D18 Working with an agent on a document. Three additions, none of which makes
      the editor a shared one. The agent edits the file; the editor follows it.
      (1) The editor reads the open document again when the server says the
      service has read a new text of it (D19), or every four seconds while the
      page is visible when it has no connection to the server, and compares
      the version token it holds. A change with no
      unsaved edit is taken, the text from before is kept in memory, and a
      notice offers a line diff and a way back, which writes that text with the
      version just read, so a third change in between is refused. A change with
      unsaved edits opens the refused-save dialog. (2) `suggest-fixes` (:read, REST only) takes a
      repository and a document and answers, for each declared reference that
      resolves to nothing and is not a document id, the code entities the index
      holds under the last part of its name: `{replacement, file, type}`,
      declared type first. `committed-document` (:read) answers the text git
      holds at HEAD with a version token, through the repository's `git show`.
      Neither writes. (3) The UI replaces one list entry with `replaceItem` in
      yamlEdit.ts, which splices that entry's range and keeps the quoting and the
      layout of the rest. The agent task is built in the editor from the
      references and candidates and sent through the existing launch route after
      the person has read it; the Node server reads no file and writes none.

  D19 Changes reach the browser by push. The service keeps a log of the last 500
      documents its index has read, written by INDEX-DOCUMENT and
      RETRACT-DOCUMENT, which the monitor's poll, a write made through the
      service and a rebuild all go through (`src/workspace/changes.lisp`). The
      `changes` operation (:read, REST only, reads no repository) answers what
      is newer than `after`, waiting up to `wait` seconds (at most 30) for
      something to be. It holds one worker thread while it waits, and answers
      `reset` when the caller has no number, a number from another run
      (`epoch` is fixed per process) or one the log no longer reaches. The Node
      server runs one such long poll for everyone (`ChangeFeed`) while any
      browser listens and sends each change on `/api/events`. The browser
      reads that stream with `fetch` and not `EventSource`, because EventSource
      cannot send the bearer token, and reconnects with a growing delay. The
      editor reads the open document when an event names its file, and the
      cards reload after a pause of 1.5 s with no further event. A websocket
      was not used: nothing travels from the browser on this channel, and SSE
      reconnects by itself. The delay is the monitor's two-second directory
      check, which is not replaced by file notifications: 1.8 s measured from
      writing a file to the editor's notice, with one read of the document.

  D20 The agent host (`src/web/packages/agent-host`). Four considered: CloudCLI
      alone, Node starting `claude` itself, the Synoptik service starting it,
      and a host of our own. CloudCLI gives no stop and no running state, is
      AGPL and a whole application. Node starting it would need Node and the
      files on one machine, which the web server does not assume. The service
      starting it would give the knowledge service the power to run commands.
      So the host is its own small Node program, started on the machine with
      the files. It runs `claude -p <task> --output-format stream-json
      --permission-mode acceptEdits --permission-prompts none --max-budget-usd N`
      in the repository, with the tools it may use named on the command line, and
      reads the stream: the first event carries the tool's session id, the last
      says how the run ended. Status is `working` while the process runs, then
      `finished`, `failed` or `idle` after a stop. `approve` is not offered:
      with prompts answered by nobody an action that would ask is refused, which
      is the safe reading until the host can answer prompts. The routes, under
      `/host/v1/`: `GET capabilities`, `GET sessions`, `POST sessions`
      {repository, task} answering 202 and the session, `GET sessions/{id}`,
      `POST sessions/{id}/stop`, `GET sessions/{id}/events` as server-sent
      events. Every route needs `Authorization: Bearer`, compared in constant
      time, and the host will not start without a token or bind beyond loopback
      without one. A repository must be a git repository named at start, by its
      real path; a request names it by that path and anything else is 403.
      One running session per repository (409), because two agents in one
      checkout overwrite each other until each has a worktree. The credentials
      are the process's environment and the tool's own login; the host does not
      read, log or return them. Sessions are kept in memory, the last 50, and a
      restart forgets them. `HostAdapter` in `packages/agents` implements
      AgentController against these routes, so the web server's agent routes
      and the interface do not change. The CloudCLI adapter is DES-0058 D4.
      Signing in from the page (R22) adds `POST auth/login` and
      `POST auth/code` to the host later: the host runs `claude auth login`,
      returns the address it prints, and writes the pasted one-time code to the
      process; the web server forwards both and stores nothing.

  D21 The terminal (R23). Claude Code runs interactively inside tmux, one
      session per repository, named `synoptik-` followed by the repository's
      folder name and the first eight hex digits of the SHA-256 of its real
      path. tmux holds the conversation, so a closed page, a restarted web
      server or a restarted host does not end it. It is also the person's own
      tmux server, so `tmux attach -t <name>` reaches the same session from an
      ordinary terminal. The session is started with `tmux new-session -d -s
      <name> -c <repository> -x <cols> -y <rows> -- claude -- <first message>`,
      and its status line is turned off. Claude Code runs with its own
      permission mode and no tool list, because the person answers its
      prompts. Its credentials are the login already made on the machine.

      The browser reaches the session through a pseudo-terminal running `tmux
      attach`. Node has no pseudo-terminal of its own, and `node-pty` is a
      native module whose install script `--ignore-scripts` would skip. So the
      host runs `bridge/pty-bridge.py`, about sixty lines of Python's standard
      `pty` module. It relays bytes between its standard streams and the
      pseudo-terminal, and reads window sizes from file descriptor 3. A new
      size is set with TIOCSWINSZ, which tmux sees as SIGWINCH.

      Host routes, beside D20's: `GET terminals` lists the live sessions by
      asking tmux. `POST terminals` {repository, message, cols, rows} returns
      the session for that repository. It starts one if there is none. If one
      is already running, the message is typed at its prompt without Enter, so
      the person can read it before sending. `POST terminals/{name}/close` ends
      the session. `GET terminals/{name}/io` is a WebSocket. A binary frame
      carries terminal bytes in either direction, and a text frame
      {"type":"resize","cols":c,"rows":r} carries a new size. The bridge
      process lives as long as the WebSocket does, and the tmux session
      outlives both. A headless launch into a repository with a live terminal
      is refused with 409, and so is a terminal in a repository where a
      headless run is working. `GET capabilities` adds `terminal` to
      `supported`. It also reports `login`: the `loggedIn` and `authMethod`
      fields of `claude auth status --json`, read at most once a minute, and no
      other field.

      The web server forwards these routes as `/api/agents/{id}/terminals...`.
      It proxies the WebSocket upgrade to the host with the host's token in
      `Authorization`. Before it upgrades, it checks the request's Origin
      against the request's Host. With no token configured, it also requires a
      loopback Host, as it does for HTTP. A browser's WebSocket cannot send a
      header, so a server with a token takes it as the subprotocol
      `synoptik-token.<token>`. The token is hex, so it is a valid subprotocol
      name. The proxy uses `ws` 8.18.0, which has no dependencies and no
      install script, in both the server and the host. The interface draws the
      terminal with `@xterm/xterm` 5.5.0 and `@xterm/addon-fit` 0.10.0.

      In the interface, Agents lists each adapter that supports `terminal`
      with its login line, and lists the workspace's repositories with "Open
      terminal" or, when one is live, "Return to terminal". The editor's
      header has "Talk about this document". It opens the terminal under the
      document with the first message "I have <path> open in Synoptik's editor.
      Read it; I want to talk about it." With unsaved edits, the action asks
      for them to be saved first. AskAgent gains "Open in terminal", which
      sends its task as the first message instead of as a headless run.

      `tools/synoptik-ui.sh start` starts the host as well when `claude` and
      `tmux` are on PATH. Its token is 32 random bytes in hex, made once and
      kept in `~/.synoptik/agent-host.token` with mode 600. Its repositories
      are `SYNOPTIK_HOST_REPOS` when that is set. Otherwise they are the roots
      the service's `status` lists at start, so a repository added later needs
      `tools/synoptik-ui.sh restart`. `stop` stops both processes and leaves
      the tmux sessions running.

  THE EDITOR

  D14 The editor opens a document from `read-document`. The YAML is parsed with a
      parser that keeps the source text and positions, so an edit replaces the
      characters it changed and leaves the rest as they were. Fields render as
      controls and `summary` and `body` render as structured text. Saving sends
      the whole text with the version it was read at. A document that loads and
      saves with no edit sends the text it received. Status changes go through
      `set-status`, not through the text, because a status change files the
      document under `completed/` and a text write does not.

  D15 The editor edits the source text and never re-serialises it. Spike S2
      (`src/web/spikes/s2-roundtrip`) parsed the 489 documents of this tree,
      game-server, front-end and utils with the `yaml` package 2.8.1. Writing
      each parsed document back out changed 484 of them. Changing one summary
      line in twenty documents that way changed 2329 other lines. Taking the
      node's source range from the parse and replacing only that range changed no
      other line. So the structured controls hold the parse for positions and
      each edit splices the characters of one node into the original text. The
      editor package is `yaml` for positions, and the text view and find and
      replace sit on a plain text buffer; the choice of a code-editor widget
      for the YAML toggle is cosmetic and left to S10. The splice side of the
      spike returns the input by construction, so the test S10 adds is that
      every spliced edit parses back to the value entered.

      A summary or body is drawn as an outline (`src/web/packages/ui/src/outline.ts`).
      Blocks are divided by blank lines. An all-capitals line is a heading and
      owns the blocks up to the next heading. A block indented deeper than the
      one before it is that block's child. A block starting `R12`, `D3` or `S2a`
      shows the label as a badge. Indent and outdent shift every line of a block
      and its children by two spaces, and move up and down swap whole subtrees.
      The outline is rebuilt from the text on every change and the blank lines
      between blocks stay in their positions, so joining an unedited outline
      returns its text; a test checks that for every summary and body in this
      tree. A literal block whose first line is indented is written `|2`,
      because YAML otherwise takes the first line's indent for the whole scalar.

  STYLE

  D7  Moved to DES-0058 D3: the shadow root, its theme and the Tailwind choice
      it settled.

  AGENTS

  D8  The interface:

          interface AgentController {
            capabilities(): Promise<Capabilities>
            list(): Promise<Session[]>
            launch(req: {repository: string; task: string; worktree?: string}): Promise<Session>
            stop(id: string): Promise<void>
            status(id: string): Promise<Status>
            subscribe(id: string, on: (s: Status) => void): () => void
            approve(id: string, requestId: string, allow: boolean): Promise<void>
          }

      `Status` is the union working, waiting-input, waiting-approval, idle,
      finished, failed, unknown (REQ-0080 R8). `Capabilities` lists which of the
      other six an adapter implements. The UI renders a control only for a
      capability the adapter reports, and a method an adapter lacks rejects with
      `Unsupported`.

  D9  The native adapter reports no capability. It was to read the retrieval log
      (REQ-0036) through a `context-log` operation. A record holds the task, the
      seeds and what came back for one `context` call, and nothing in it names
      the session that made the call, so no session can be listed and no status
      can be told from it. The adapter says so in its notes and invents nothing.
      `context-log` is not built, and PLAN-0062 S5 no longer lists it.

  D10 Moved to DES-0058 D4: the CloudCLI adapter.

  D11 Launch and stop are writes. The Node server offers them only when the
      service grants :write and the adapter reports the capability, as the MCP
      listing already withholds `synoptik_context_used` from a read-only caller
      (REQ-0032).

  TESTS

  D12 The Lisp operations get FiveAM cases beside the existing ones in
      `src/serve/test/`. `write-document` has a case that fails without the
      version check: two writers read one version, the second write is refused
      with 409, and the file holds the first writer's text (CON-0003).
      `create-document` has a case that refuses a design. The web packages use
      Vitest and Testing Library. The proxy has cases that fail without its
      checks: an operation off the allow list is refused, a non-loopback bind
      without a token refuses to start, and a wrong token is refused. R13 is
      checked in a browser at 360 px, with no horizontal scroll on the page and
      every control at least 44 px square. The round trip of D15 is checked by
      a spike before any component is written.

  REACHING IT FROM A PHONE

  D13 The Synoptik listener binds 127.0.0.1 and refuses a non-loopback Host
      (DEC-0008), because the service has no credential and
      `resolve-caller-grants` gives every caller :read and :write. A phone
      reaches the UI through the Node server, which D6 makes the authenticated
      boundary. Through the standalone listener the phone sends a token, over TLS or a tunnel the user provides.
      The Lisp check is unchanged and still protects the service from a web page
      in the user's browser.

  ALTERNATIVES CONSIDERED

  A Lisp peer system serving the files and the API directly to the browser.
  Rejected after the owner chose a Node proxy on 2026-10-17. It would give the
  plugin no shared code with the standalone shell, since CloudCLI's plugin
  server is a Node process, and it would leave agent credentials to the
  browser. It also cannot take the authentication boundary without adding
  the credential REQ-0008 excludes.

  A document write that goes through `complete` or `set-status`. Both change a
  status and file the document. Neither takes text, and extending them to would
  make a transition operation do an edit's work.

  One Lisp system serving the UI inside synoptik-rest. Rejected because
  synoptik-rest's routes are derived from the registry and a static-file
  handler is not an operation, so the file would hold two shapes.

  Components that build their own URLs. Rejected because a host may have no URL
  to the service. The plugin's only route out of the browser is `api.rpc`
  (DES-0058 D2).

  Cost of the Node server. A second runtime to run beside SBCL, and a second
  process for the service's unit to supervise; `tools/` gains a script to start it.
  A request crosses one extra local hop. Not measured.

  OUTSTANDING

  Whether the retrieval log identifies sessions (D9). It is listed under
  REQ-0080's open questions and blocks nothing. The CloudCLI questions moved to
  DES-0058 and REQ-0083.
importance: Critical
