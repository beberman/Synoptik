id: PLAN-0062
title: Build the web UI in sixteen steps, a clickable prototype for approval first, then three spikes, the four registry operations, the Node proxy, the explorer, the editor, the agents and the CloudCLI plugin
status: draft
date: 2026-10-17
refines: [DES-0057]
affects: [set-document-status, check-document-references]
tags: [web, ui, react, node, tailwind, cloudcli, plugin, editor, req-0080,
       des-0057, dec-0011, dec-0012]
summary: |
  Sequences DES-0057 into sixteen steps. Step 0 is a clickable prototype that
  runs on its own, outside CloudCLI and without the service, for the owner to
  review and approve before anything else is built. Steps 1 to 3 are spikes that can run in
  any order and each settles a question the design left open: whether Tailwind
  builds into a shadow root, which editor keeps a document byte-identical, and
  what CloudCLI's API and plugin loader allow. Steps 4 and 5 are the Lisp half,
  four registry operations. Steps 6 to 8 are the Node half, the client, the
  proxy and the standalone listener. Steps 9 to 11 are the components, 12 is the
  agents, 13 the phone checks, 14 the plugin repository, 15 the acceptance run
  from REQ-0080 on this tree and on game-server.

  Out of scope: a credential for the Synoptik service, which REQ-0008 excludes;
  a native app; creating any document type other than a requirement or a bug.
body: |
  WORKING RULES

  Nothing after S0 starts until the owner has approved S0 or named its changes.
  S0 fixes what the screens look like and do; the later steps build the parts
  behind them.

  Each step ends with its tests passing and, for a Lisp step, `check` reporting
  no violations and `tools/synoptik-test.sh` green. A step that adds a test
  names the change that makes it fail (CON-0003). The work stays on branches
  named after REQ-0080 and merges to `develop` by pull request. Nothing merges to
  `main` until the whole plan is done.

  THE PROTOTYPE

  S0  A clickable UI, run with `npm run dev` from `src/web/apps/standalone/` and
      also built as a static page the owner can open without a server. It is
      the real stack, React and Tailwind in the `src/web` workspace, so what is
      approved carries forward and is not redrawn. It is web only: no CloudCLI
      plugin, no Node proxy, no change to the Lisp service. It calls a mock Client that
      reads a fixture, not the service. The fixture is generated by a script
      from this tree's `docs/` (id, title, type, status, priority, tags,
      `refines`, `affects`) so the explorer shows 338 real documents. It
      shows, with everything clickable:

        the explorer: type icons with id and short title; filters by type,
        status, priority, tag and text; widening by links; the requirements
        tagged `multi-user` with their designs and plans drawn around them,
        and an unresolved reference marked;

        the document view: relationships grouped by edge type, and the editor
        with field controls, a structured summary and body, no styling
        controls, undo and redo, find and replace, the raw toggle, and a
        `check_document` panel beside it, showing canned results;

        new requirement and new bug, with no way to make another type;

        a status change and a `complete` dry run, with canned text;

        an agents panel with each status in the set, and launch and stop
        controls that appear only when the adapter reports the capability,
        switchable between a full adapter, a list-only adapter and none;

        the workspace: game-server, front-end and utils beside this tree in one
        explorer, a repository filter, a panel to add, pause, reindex and
        remove folders, and a folder picker that refuses a directory that is
        not a git repository;

        the phone layout at 360 px, and light and dark themes.

      Edits live in memory and are lost on reload, and the editor is a stand-in
      chosen for how it looks, since S2 has not run. Nothing is written to
      `docs/`. The prototype is not the editor library, the proxy or the
      plugin. Review notes are recorded in REQ-0080 as changes to its R-items
      before S1.

  THE SPIKES

  S1  Shadow root and Tailwind. Build a page styled with Tailwind 3 and again
      with Tailwind 4, mount each into a shadow root with a constructed
      stylesheet, and mount the Tailwind 3 and 4 builds through the plugin
      starter's `npm run build` into a local CloudCLI instance. Record: the unit
      `rem` resolves to inside the root, whether shadows and gradients draw
      under Tailwind 4, whether a Radix dialog portalled into the root is
      styled, and whether CloudCLI's own tabs change with the plugin enabled.
      Output: the Tailwind major version, written into DEC-0011 as an amendment.
      If neither builds, DEC-0011's fallback is CSS Modules and the DEC is
      superseded.

  S2  Editor round trip. For each candidate editor, load every document under
      `docs/` (338 here), save with no edit, and count files whose bytes differ.
      Then make one edit to a body line in twenty documents and count the lines
      that changed beyond it. Output: the library, written into DES-0057 D15. A
      library with any unedited file changed is out.

  S3  CloudCLI. Read its REST API routes for sessions, launch and stop, its
      authentication, and its cross-origin rules. Install it locally and check
      whether a plugin tab appears in its mobile view and at what width, and
      whether the plugin loader accepts a subdirectory. Output: REQ-0080's open
      questions answered or restated, and the capabilities the CloudCLI adapter
      can claim (DES-0057 D10).

  THE LISP HALF

  S4  Workspace functions. In synoptik-workspace, beside `set-document-status`:
      `read-document-text` returning the text and version, `write-document-text`
      taking the version it was read at, and `create-document` for a category,
      title and optional refines. The last accepts `req` and `bug` and refuses
      every other category naming the two allowed. It takes the id from
      `docstore-allocate-id` and the text from a template with the required
      fields. Tests: the stale-version write is refused and the file holds the
      first writer's text; creating a design is refused; a created requirement
      passes `check-document`.

  S5  Registry operations in `src/serve/operations.lisp`: `documents`,
      `read-document`, `write-document` and `create-document`. `context-log` is not built: a
      retrieval record names no session (DES-0057 D9). `write-document` answers the `check-document` result for the text it
      wrote. The four are on REST only: MCP lists its tools by hand
      (`src/mcp/tools.lisp`) and an agent edits the file in its worktree, so the
      MCP tool set, its test and `mcp-manifest.json` do not change. A write made
      from a stale version signals `version-conflict`, which REST answers as 409
      with the stored text and version under `current`. `write-document` and
      `create-document` are :write
      tier. Tests include a 409 body carrying the current version and text.

  THE NODE HALF

  S6  `src/web` workspace: `package.json` with workspaces, a pinned Node engine,
      TypeScript, Vitest, and `packages/client` with the Client type, the fetch
      client and the conflict error. The response types are written against the
      JSON the S5 operations return, and a contract test runs the client against
      a running service.

  S7  `packages/server`: `createHandler`, the allow list, the bearer token, the
      loopback-by-default bind rule, forwarding with a loopback Host, and the
      server-sent event stream. Tests fail without each check: an operation off
      the list is refused, a wrong token is refused, a non-loopback bind without
      a token does not start. The workspace store reads and writes
      `~/.synoptik/web.json`: tests cover the atomic write, a missing file, a
      file that does not parse being left untouched, a missing folder shown and
      kept, and `watch` and `pause` replayed at startup. The same store holds
      `~/.synoptik/ui-state.json` behind `GET` and `PUT /api/ui-state` (D17), with a
      test that an entry for a removed folder is dropped on load.

  S8  `apps/standalone`: the Vite shell and a listener that calls `createHandler`
      and serves the build. `tools/synoptik-ui.sh` starts and stops it from any
      directory, as `tools/synoptik-serve.sh` does, and `synoptik-serve.sh install`
      grows a second unit or a documented one. INSTALL.md gains a section and
      CLAUDE.md names the new tool and the `src/web` directory.

  THE COMPONENTS

  S9  `packages/ui`, explorer. The document list and map, the filters, widening
      by links, the type icons, id and short title, and the relationships view
      with unresolved references marked. Tailwind per S1. Tests: a filter on the
      tag `multi-user` widened by two links returns the documents DES-0057's
      acceptance names, on a fixture copied from this tree.

  S10 `packages/ui`, editor. The library from S2. Form controls for fields, the
      structured view of summary and body, no styling controls, undo and redo,
      find and replace, the raw toggle, the save with version, the conflict view
      with both versions, and `check_document` beside the editor. Status changes
      call `set-status`. A test opens and saves every fixture document and
      requires identical bytes.

  S11 `packages/ui`, create and transitions. The new-requirement and new-bug flows
      with a refines picker from the explorer, and `complete` with its dry run
      shown as text.

  AGENTS, PHONE, PLUGIN, ACCEPTANCE

  S12 `packages/agents`: the interface, the status type, the native adapter, and
      the CloudCLI adapter with the capabilities S3 established. The server
      registers the adapters and the UI hides what is not offered.

  S13 Responsive pass. A browser test at 360 px wide checks no horizontal page
      scroll and controls of at least 44 px for every view, and the graph's list
      form. Repeat against the plugin build.

  S16 Changes made outside the editor (R18). The service logs what it indexes and
      `changes` long-polls it; the Node server streams that on `/api/events`; the
      editor reads the open document when an event names it, or on a timer when
      the stream is down, takes an outside change when nothing is unsaved, keeps the text
      from before, and shows a line diff with a way back; unsaved edits open the
      refused-save dialog. `committed-document` answers git's text for the
      other way back. Tests: `diff.test.ts`, the Lisp tests for the operation,
      and the browser run (an outside write, the diff, going back).

  S17 Suggested fixes (R20). `suggest-fixes` on the service; `replaceItem` in
      yamlEdit.ts, tested for layout and quoting; the check column offers each
      candidate and saves the replacement when nothing else is unsaved. The
      browser run moves a function between files and uses the offer.

  S18 Asking an agent (R19). The task text is built from the unresolved
      references and the candidates, shown for editing, and sent through the
      adapter that can launch. With none, the dialog says so and does not send.

  S19 The agent host (R21). `packages/agent-host`: the routes, the bearer check,
      the repository list, one session per repository, a runner that starts
      `claude -p` and reads its stream, and a fake runner for tests.
      `HostAdapter` in `packages/agents`, registered by
      `SYNOPTIK_AGENT_HOST_URL` and `SYNOPTIK_AGENT_HOST_TOKEN`.
      `tools/synoptik-ui.sh host start|stop|status`. Tests: the host against a
      fake runner over HTTP, the stream parser on recorded lines, the adapter
      against the real host. One live run on this machine, as the
      acceptance section describes.

  S20 Signing in from the page (R22), after S19 has run for real: the two host
      routes, a panel in Agents that shows the address and takes the code, and a
      test that the web server stores neither. Not built: R22 is replaced by
      REQ-0081 R7.

  S21 The terminal (R23, D21). In the host: `bridge/pty-bridge.py`, the terminal
      routes, the tmux session per repository, the login line in
      `capabilities`, and the lock shared with headless runs. In the agents
      package: the terminal methods on HostAdapter. In the web server: the
      terminal routes and the WebSocket proxy, with the Origin and token checks.
      In the interface: Agents lists hosts, their login and a terminal per
      repository; a Terminal component on xterm.js; a "Talk about this
      document" action in the editor that opens it under the document.
      `tools/synoptik-ui.sh start|stop|status` start and stop the host with the
      server. Tests: the host's terminal routes against a fake tmux, the proxy
      refusing a foreign Origin and a missing token, the bridge relaying bytes
      and a resize. One live conversation on this machine, as the acceptance
      section describes.

  S14 The `synoptik-cloudcli-plugin` repository: `manifest.json` at the root,
      `src/index.ts` with `mount` and `unmount`, `src/server.ts` calling
      `createHandler`, a pinned dependency on the `src/web` packages. Install it
      from its git URL into a CloudCLI instance and run the plugin half of
      REQ-0080's acceptance, including the theme switch and CloudCLI's own tabs
      unchanged. Settle its licence against CloudCLI's AGPL-3.0 first.

  S15 Acceptance. Run REQ-0080's acceptance section end to end on this tree and on
      game-server, as the memory on dogfooding requires, then `complete`
      PLAN-0062 with verdicts for DES-0057 and REQ-0080. A requirement item the
      run does not meet makes REQ-0080 `partial` with an OUTSTANDING section.

      Measured so far (2026-10-17, through the running service): all 489
      workflow documents of this tree, game-server, front-end, utils and
      lfia-accounting were read and saved unchanged; none differed from the
      file on disk and none was written. game-server holds two files with the id
      BUG-0004, `docs/bugs/BUG-0004.yaml` and `docs/bugs/completed/BUG-0004.yaml`;
      the service refuses to read either by id and says so, which is the right
      answer and a defect in that tree. A browser run (`src/web/e2e/run.mjs`)
      adds a folder, edits, hits a conflict, creates, checks 44 px targets at
      360 px and removes the folder, in a scratch repository. Not yet done: S14, a phone over a real network, and the acceptance run's remaining items.

  RISKS

  S2 can reject every candidate. The fallback is a plain-text editor with a
  formatted preview, which meets R5 only in part and would make REQ-0080
  `partial`. S1 can reject both Tailwind versions in a shadow root, which costs
  a restyle in CSS Modules before S9. S3 can find that CloudCLI's API offers no
  launch route, leaving the CloudCLI adapter with `list` alone and R10 met in
  part.
